<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primpaii's Way ✿</title>
<meta name="description" content="Primpaii's Way — jurnal kecil untuk mencatat order, rekapan, dan reminder renewal.">
<meta name="theme-color" content="#FDE3EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='86' fill='%23F195BC'%3E%EA%95%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDE3EB;--pink:#F2B0CD;--rose:#F195BC;--blue:#D2ECFB;--cream:#FEEFF3;
  --ink:#80566b;--muted:#ad8094;--title:#925d78;--accent:#e99fbe;--accent-2:#db8eb0;
  --card:#fffafd;--surface:#ffffff;--soft:#fdf0f5;--soft-2:#fff4f8;--sky:#f1f9fd;--sky-line:#d9edf8;--sky-ink:#718ea0;
  --line:#f5d3e1;--line-2:#f8e8ef;--glass:#fff9fcbb;
  --shadow:0 12px 35px #d98eae22;--font:'Nunito',sans-serif;--floaty:var(--rose);--ornament:#cf8eab
}
body.dark{
  --bg:#2b222e;--cream:#3a2d38;--card:#43353f;--surface:#4a3b46;--soft:#54424f;--soft-2:#4d3d49;--sky:#3c4250;--sky-line:#4f5868;--sky-ink:#c2d6e4;
  --ink:#f6dce8;--muted:#d2a9bf;--title:#f7c6dc;--line:#634a5b;--line-2:#574350;--glass:#33283299;
  --shadow:0 12px 35px #00000033;--floaty:#f2b0cd;--ornament:#f2b0cd
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(145deg,var(--bg),var(--cream));background-attachment:fixed;color:var(--ink);font-family:var(--font);min-height:100vh;transition:background .4s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ꕤ floating background */
#floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floater{position:absolute;left:var(--x);top:var(--y);opacity:0;will-change:transform,opacity;animation:appear 3.5s ease-out forwards,drift var(--drift-t) ease-in-out infinite alternate;animation-delay:var(--in),var(--delay)}
.floater span{display:block;font-family:'Nunito',sans-serif;font-weight:300;font-size:var(--size);color:var(--floaty);line-height:1;will-change:transform;animation:bob var(--bob) ease-in-out infinite alternate;animation-delay:var(--delay);filter:blur(var(--blur))}
.floater.emoji span{filter:saturate(.35) blur(var(--blur))}
@keyframes appear{to{opacity:var(--o)}}
@keyframes drift{from{transform:translate3d(calc(var(--dx) * -1),0,0)}to{transform:translate3d(var(--dx),0,0)}}
@keyframes bob{from{transform:translate3d(0,calc(var(--amp) * -1),0) rotate(calc(var(--rot) * -1))}to{transform:translate3d(0,var(--amp),0) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.floater,.floater span{animation:none!important}.floater{opacity:var(--o)}}

.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{padding:28px 18px;background:var(--glass);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column}
.brand{font-family:'Parisienne','Cormorant Garamond',serif;font-size:40px;font-weight:400;line-height:1.1;text-align:center;margin:10px 0 22px;color:#bd7597;letter-spacing:.5px}
.ornament{display:block;font:400 15px/1.2 var(--font);color:var(--ornament);letter-spacing:1px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}
body.dark .brand{color:var(--title)}
.brand small{display:block;font:600 10px var(--font);letter-spacing:3px;text-transform:uppercase;margin-top:10px;color:var(--muted)}
.nav{display:grid;gap:8px;margin-top:26px}
.nav button{padding:12px 14px;border-radius:15px;text-align:left;font-weight:700;color:var(--muted);transition:.2s}
.nav button:hover,.nav button.active{background:linear-gradient(100deg,#f6c9dc,#fce8f0);color:#86516d;box-shadow:0 5px 16px #df9dbb2b}
.nav .count{float:right;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:2px 7px;margin-top:2px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.main{padding:30px clamp(18px,4vw,54px);max-width:1600px;width:100%;margin:auto;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800}
.heading{font:600 31px 'Cormorant Garamond',serif;margin:3px 0;color:var(--title)}
.sub{color:var(--muted);font-size:13px}
.datepill,.softbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:12px;font-weight:700;transition:.2s}
.softbtn:hover{background:var(--soft);color:var(--title)}
.softbtn.danger:hover{background:#fde2e2;color:#b05656}
.panel{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:var(--shadow);min-width:0}
.view{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px 18px;position:relative;overflow:hidden;min-height:112px;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat:nth-child(3n+2){background:var(--soft-2)}
.stat:nth-child(3n){background:var(--sky)}
.stat .label{font-size:12px;color:var(--muted);font-weight:700}
.stat .value{font-size:25px;font-weight:800;color:var(--title);margin-top:9px;word-break:break-word}
.stat .deco{position:absolute;right:13px;top:10px;font-size:23px;opacity:.45}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.panel>.section-title:first-child{margin-top:0}
.section-title h3{font:600 23px 'Cormorant Garamond',serif;margin:0;color:var(--title)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.table th{background:var(--soft);color:var(--muted);text-align:left;padding:12px 13px;font-weight:800;position:sticky;top:0}
.table td{padding:11px 13px;border-top:1px solid var(--line-2)}
.table tr:hover td{background:var(--soft-2)}
.table td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px;align-content:start}
.field label{font-size:11px;font-weight:800;color:var(--muted)}
.field label .req{color:var(--rose)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 11px;outline:none;transition:.2s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f6dce788}
.preview{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.preview b{color:var(--title)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
.section-title .actions{margin-top:0}
.primary{background:var(--accent);color:#fff;padding:10px 17px;border-radius:999px;font-weight:800;box-shadow:0 5px 13px #df9dbb44;transition:.2s}
.primary:hover{background:var(--accent-2);transform:translateY(-1px)}
.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:#fce8f0;color:#a36d86;font-size:10px;font-weight:800}
.pill.blue{background:#e7f5fc;color:#5d8399}
.pill.warn{background:#fff0d9;color:#9c7042}
.pill.due{background:#fde0ea;color:#b4517c}
.pill.done{background:#e8f6ef;color:#56856d}
.bar{height:8px;border-radius:20px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--rose));border-radius:20px;transition:width .6s}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.notice{padding:13px 15px;background:var(--sky);border:1px solid var(--sky-line);border-radius:15px;font-size:12px;line-height:1.6;color:var(--sky-ink)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:37px;height:37px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #e9ccda;transition:.2s}
.swatch.chosen{box-shadow:0 0 0 2px var(--accent);transform:scale(1.08)}
.symbol-choice{display:flex;gap:8px;flex-wrap:wrap}
.symbol-choice button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 11px;min-width:40px}
.symbol-choice button.chosen{background:#f8d9e6;border-color:#e9a7c2;color:#86516d}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.row:last-child{border-bottom:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:9px 14px;font-size:12px;outline:none}
.toolbar input{flex:1;min-width:180px}
.mp-now{position:relative;background:linear-gradient(150deg,var(--soft-2),var(--sky));border:1px solid var(--line);border-radius:20px;padding:16px 14px 10px;text-align:center;overflow:hidden}
.mp-now::before{content:'♡ ✧';position:absolute;left:13px;top:10px;color:var(--rose);opacity:.5;font-size:12px;letter-spacing:3px}
.mp-deco{position:absolute;top:7px;right:12px;font-size:18px;opacity:.35;filter:saturate(.35)}
.mp-title{font:600 20px 'Cormorant Garamond',serif;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.mp-prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.mp-prog input,.mp-vol input{flex:1;min-width:0;accent-color:var(--rose);height:28px}
.mp-ctrl{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px 0}
.mp-btn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--title);font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.mp-btn:hover:not(:disabled){background:var(--soft)}
.mp-btn.sm{width:38px;height:38px;font-size:14px;color:var(--muted)}
.mp-btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.mp-btn.main{width:52px;height:52px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px;box-shadow:0 5px 13px #df9dbb44}
.mp-btn.main.playing{animation:mpPulse 2.6s ease-in-out infinite}
@keyframes mpPulse{50%{box-shadow:0 0 0 7px #f195bc22}}
.mp-btn:disabled{opacity:.4;cursor:default}
.mp-vol{display:flex;align-items:center;gap:10px}
.mp-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--soft);padding:4px;border-radius:999px;margin:14px 0 10px}
.mp-tabs button{border-radius:999px;padding:8px 4px;min-height:38px;font-size:12px;font-weight:800;color:var(--muted);transition:.2s}
.mp-tabs button.active{background:var(--surface);color:var(--title);box-shadow:0 3px 10px #d98eae22}
.mp-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.src{display:inline-block;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;line-height:1.5}
.src.sp{background:var(--blue);color:#5f8299}.src.yt{background:#f8d9e6;color:#a65a7e}.src.cu{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
.mp-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line-2);border-radius:12px;transition:background .2s}
.mp-row:last-child{border-bottom:0}
.mp-row.on{background:var(--soft-2)}.mp-row.on b{color:var(--rose)}
.mp-ico{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--title);font-size:12px}
.mp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.mp-info b,.mp-info .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-acts{display:flex;gap:2px;flex:none}
.mp-acts button{width:32px;height:36px;border-radius:10px;color:var(--muted);font-size:13px}
.mp-acts button:hover:not(:disabled){background:var(--soft);color:var(--title)}
.mp-acts button:disabled{opacity:.3;cursor:default}
.mp-acts .faved{color:var(--rose)}
.mp-dock{position:fixed;right:16px;bottom:16px;z-index:15;width:340px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:dockIn .35s ease-out}
.mp-dock.compact{width:250px}
@keyframes dockIn{from{opacity:0;transform:translateY(12px)}}
.dk-top{display:flex;align-items:center;gap:2px;padding:5px 5px 5px 10px}
.dk-title{flex:1;min-width:0;font-size:11px;font-weight:700;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px}
.dk-top button,.dk-top a{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-decoration:none}
.dk-top button:hover,.dk-top a:hover{background:var(--soft);color:var(--title)}
.dk-host:empty{display:none}
.dk-host iframe{display:block;width:100%;border:0}
.dk-host.youtube{aspect-ratio:16/9;background:#000}.dk-host.youtube iframe{height:100%}
.dk-host.spotify iframe{height:152px!important}
.mp-dock.compact .dk-host.spotify iframe{height:80px!important}
.mp-dock:not(.compact) .dk-host.spotify:not(.k-track):not(.k-episode) iframe{height:352px!important}
body.has-dock .main{padding-bottom:240px}
body.has-dock .toast{bottom:auto;top:20px}
@media(max-width:560px){.mp-two{grid-template-columns:1fr}.mp-row{flex-wrap:wrap}.mp-acts{width:100%;justify-content:flex-end}.mp-acts button{width:40px;height:40px}.mp-dock{right:12px;bottom:12px}.mp-dock.compact{width:220px}}
@media (prefers-reduced-motion:reduce){.mp-btn.main.playing,.mp-dock{animation:none}}
.toast{position:fixed;bottom:20px;right:20px;background:#93627b;color:#fff;padding:12px 17px;border-radius:14px;box-shadow:var(--shadow);z-index:20;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:none}
.hidden{display:none!important}
.small{font-size:11px;color:var(--muted);line-height:1.6}
.iframe{width:100%;height:360px;border:1px solid var(--line);border-radius:14px;background:#fff}
a{color:var(--title)}
.bigvalue{font-size:34px;font-weight:800;color:var(--title)}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{height:auto;position:sticky;top:0;z-index:5;padding:12px 14px}
  .brand{font-size:31px;margin:2px 0}.ornament{font-size:12px;margin-top:1px}.brand small{margin-top:4px}
  .sidefoot{display:none}
  .nav{display:flex;overflow:auto;margin:10px 0 0;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:9px 12px}
  .nav .count{float:none;margin-left:6px}
  .main{padding:22px 15px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.settings-grid{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .stats{gap:9px}.stat{padding:13px;min-height:100px}.stat .value{font-size:19px}
  .top{flex-direction:column;align-items:flex-start}.heading{font-size:27px}
  .toast{left:20px;right:20px}
}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Primpaii's Way<span class="ornament" aria-hidden="true">꒷꒦︶꒷꒦︶ ๋ ࣭ ⭑꒷꒦</span><small>little things, lovely records</small></div>
    <nav class="nav" id="nav" aria-label="Menu utama">
      <button class="active" data-page="dashboard">✿ Dashboard</button>
      <button data-page="rekapan">ꕤ Rekapan</button>
      <button data-page="reminder">♡ Reminder</button>
      <button data-page="riwayat">✧ Riwayat Order</button>
      <button data-page="setting">⚙ Setting</button>
    </nav>
    <div class="sidefoot">made with love &amp; a little sparkle<br>♡ Primpaii's Way ♡</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <div class="eyebrow">your tiny business journal</div>
        <h1 class="heading" id="pageTitle">✿ Dashboard</h1>
        <div class="sub" id="pageSub">Semua ringkasan order dalam satu tempat.</div>
      </div>
      <div class="datepill" id="today"></div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="mp-dock hidden" id="mpDock" aria-label="Pemutar musik"><div class="dk-top"><span class="src" id="dkSrc"></span><span class="dk-title" id="dkTitle"></span><button id="dkPlay" aria-label="Play/Pause">▶</button><button id="dkNext" aria-label="Lagu berikutnya">⏭</button><button id="dkSize" aria-label="Ubah ukuran pemutar" title="Compact / besar">⤢</button><a id="dkOpen" target="_blank" rel="noopener" aria-label="Buka di aplikasi asli" title="Buka sumber asli">↗</a><button id="dkClose" aria-label="Hentikan &amp; tutup pemutar" title="Tutup">✕</button></div><div class="dk-host" id="dkHost"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const fmt=d=>d?new Date((d instanceof Date?iso(d):d)+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const readJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};

let orders=readJSON('pw_orders',[]);
let settings=readJSON('pw_settings',{});
let page='dashboard',editId=null,filter={q:'',month:''};
let playlist=readJSON('pw_playlist',[]).filter(t=>t&&t.url).map(t=>({id:t.id||uid(),name:t.name||'Tanpa judul',artist:t.artist||'',source:t.source||'url',kind:t.kind||'',ref:t.ref||'',list:t.list||'',url:t.url,fav:!!t.fav}));
let curId=null,loadedId=null,isPlaying=false,gen=0,yt=null,sp=null,spPos={pos:0,dur:0,at:0},tick=null,seeking=false,favOnly=false;
const PAGES={dashboard:['Dashboard','Semua ringkasan order dalam satu tempat.'],rekapan:['Rekapan','Detail pemasukan, pengeluaran, dan profit order.'],reminder:['Reminder','Pantau masa aktif dan jadwal renewal customer.'],riwayat:['Riwayat Order','Jejak order dan aplikasi favorit customer.'],setting:['Setting','Atur suasana, tampilan, dan koneksi spreadsheet.']};
const defaults={font:'Nunito',theme:'light',bg:'#FDE3EB',floaty:'soft',symbol:{dashboard:'✿',rekapan:'ꕤ',reminder:'♡',riwayat:'✧',setting:'⚙'},volume:.6,muted:false,repeat:'all',shuffle:false,compact:true,mpTab:'spotify',sheetUrl:'https://docs.google.com/spreadsheets/d/1F95-UMgaSWF8zIapli2j40NehaGPvCszQvnxsuxSmcM/edit?usp=sharing',scriptUrl:''};
const S={...defaults,...settings,symbol:{...defaults.symbol,...(settings.symbol||{})}};
delete S.music; // old synthetic ambient setting; music only starts when Play is pressed

function save(){localStorage.setItem('pw_orders',JSON.stringify(orders));localStorage.setItem('pw_settings',JSON.stringify(S));localStorage.setItem('pw_playlist',JSON.stringify(playlist))}
let toastTimer;function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- perhitungan ---------- */
function endDate(o){let d=new Date(o.date+'T00:00:00');d.setDate(d.getDate()+Number(o.duration||0));return d}
function remain(o){return Math.round((endDate(o)-new Date(todayISO()+'T00:00:00'))/86400000)}
function state(o){let r=remain(o);if(o.status==='selesai'||r<0)return'done';if(r===0)return'due';if(r<=3)return'soon';return'active'}
const STATE_LABEL={done:['Selesai','done'],due:['Renewal hari ini','due'],soon:['Segera renewal','warn'],active:['Aktif','blue']};
function profit(o){return Number(o.income||0)-Number(o.expense||0)}
function net(o){return profit(o)-Number(o.discount||0)}
const sum=(list,f)=>list.reduce((a,o)=>a+f(o),0);
function stats(){let c={active:0,due:0,soon:0,done:0};orders.forEach(o=>c[state(o)]++);return{total:orders.length,active:c.active+c.due+c.soon,due:c.due,soon:c.soon,finished:c.done,net:sum(orders,net)}}

/* ---------- render ---------- */
function applyLook(){
  document.body.style.setProperty('--font',`'${S.font}',sans-serif`);
  document.body.classList.toggle('dark',S.theme==='dark');
  document.documentElement.style.setProperty('--bg',S.theme==='dark'?'#2b222e':S.bg);
  document.querySelector('meta[name=theme-color]').content=S.theme==='dark'?'#2b222e':S.bg;
}
function render(){
  applyLook();
  $('#today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let s=stats(),attention=s.due+s.soon;
  $$('#nav button').forEach(b=>{let k=b.dataset.page;b.classList.toggle('active',k===page);b.setAttribute('aria-current',k===page?'page':'false');b.innerHTML=`${S.symbol[k]} ${PAGES[k][0]}${k==='reminder'&&attention?`<span class="count">${attention}</span>`:''}`});
  $('#pageTitle').textContent=`${S.symbol[page]} ${PAGES[page][0]}`;$('#pageSub').textContent=PAGES[page][1];
  ({dashboard,rekapan,reminder,riwayat,setting})[page]();
  $('#content').firstElementChild?.classList.add('view');
}
function card(label,value,deco,sub=''){return `<div class="stat"><span class="deco" aria-hidden="true">${deco}</span><div class="label">${label}</div><div class="value">${value}</div><div class="small">${sub}</div></div>`}

function dashboard(){
  let s=stats(),editing=editId&&orders.find(o=>o.id===editId);
  let needs=orders.filter(o=>['due','soon'].includes(state(o))).sort((a,b)=>remain(a)-remain(b)).slice(0,4);
  $('#content').innerHTML=`<div><div class="stats">${card('Total Order',s.total,'✿','Semua order tercatat')}${card('Order Aktif',s.active,'♡','Masa layanan masih berjalan')}${card('Renewal Hari Ini',s.due,'ꕤ','Perlu diperpanjang hari ini')}${card('Segera Renewal',s.soon,'✧','Habis dalam 1–3 hari')}${card('Order Selesai',s.finished,'☁','Masa layanan telah berakhir')}${card('Total Pendapatan Bersih',money(s.net),'₊˚','Pemasukan − pengeluaran − diskon')}</div>
  <div class="two"><section class="panel" id="formPanel"><div class="section-title"><h3>${editing?'✧ Edit order':'♡ Tambahkan order baru'}</h3><span class="pill">${editing?'mode edit':'quick add'}</span></div>${orderForm(editing||{})}<div class="preview" id="preview"></div><div class="actions"><button class="primary" id="submitOrder">${editing?'Simpan perubahan ✿':'Simpan order ✿'}</button><button class="softbtn" id="cancelEdit">${editing?'Batal':'Reset form'}</button></div></section>
  <section class="panel"><div class="section-title"><h3>ꕤ Perlu diperhatikan</h3><button class="softbtn" onclick="go('reminder')">Reminder</button></div>${needs.map(o=>{let r=remain(o);return `<div class="row"><span><b>${esc(o.customer)}</b><br><span class="small">${esc(o.app)} · habis ${fmt(endDate(o))}</span></span><span class="pill ${STATE_LABEL[state(o)][1]}">${r===0?'hari ini':r+' hari lagi'}</span></div>`}).join('')||'<div class="notice">Tidak ada renewal dalam 3 hari ke depan ♡<br>Durasi dihitung otomatis dari tanggal order. Hari terakhir dihitung sebagai hari aktif.</div>'}
  <div class="section-title"><h3>✧ Order terbaru</h3><button class="softbtn" onclick="go('rekapan')">Lihat semua</button></div>${orders.slice(-4).reverse().map(o=>`<div class="row"><span><b>${esc(o.customer)}</b><br><span class="small">${esc(o.app)} · ${fmt(o.date)}</span></span><b>${money(net(o))}</b></div>`).join('')||'<div class="empty">Belum ada order. Yuk catat yang pertama ♡</div>'}</section></div></div>`;
  $('#submitOrder').onclick=saveOrder;
  $('#cancelEdit').onclick=()=>{let was=editId;editId=null;was?go('rekapan'):dashboard()};
  $('#formPanel').addEventListener('input',updatePreview);updatePreview();
}
function updatePreview(){let o=readForm();let end=o.date&&o.duration?fmt(endDate(o)):'—';$('#preview').innerHTML=`<span>Durasi habis: <b>${end}</b></span><span>Profit: <b>${money(profit(o))}</b></span><span>Bersih: <b>${money(net(o))}</b></span>`}
function orderForm(o={}){return `<div class="formgrid">
${field('Tanggal order','date','date',o.date||todayISO(),'',[],true)}${field('Aplikasi','text','app',o.app||'','Netflix, Canva, Spotify...',[],true)}${field('Plan','text','plan',o.plan||'','Basic / Premium / Family')}
${field('User / akun','text','user',o.user||'','Email / username')}${field('Durasi (hari)','number','duration',o.duration||'','Contoh: 30',[],true)}${field('Nama customer','text','customer',o.customer||'','Nama customer',[],true)}
${field('Nama FH','text','fh',o.fh||'','Nama FH')}${field('Pemasukan (Rp)','number','income',o.income??'','0')}${field('Pengeluaran (Rp)','number','expense',o.expense??'','0')}
${field('Diskon (Rp)','number','discount',o.discount??'','0')}${field('Akun / catatan','text','account',o.account||'','Opsional')}${field('Status','select','status',o.status||'aktif','',['aktif','selesai'])}
</div>`}
function field(label,type,id,value='',placeholder='',opts=[],req=false){let control=type==='select'?`<select id="f_${id}">${opts.map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input id="f_${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type==='number'?'min="0" inputmode="numeric"':''}>`;return `<div class="field"><label for="f_${id}">${label}${req?' <span class="req">*</span>':''}</label>${control}</div>`}
function val(id){return $(`#f_${id}`)?.value||''}
function readForm(){return{date:val('date'),app:val('app').trim(),plan:val('plan').trim(),user:val('user').trim(),duration:Math.max(0,Number(val('duration'))||0),customer:val('customer').trim(),fh:val('fh').trim(),income:Math.max(0,Number(val('income'))||0),expense:Math.max(0,Number(val('expense'))||0),discount:Math.max(0,Number(val('discount'))||0),account:val('account').trim(),status:val('status')||'aktif'}}
function saveOrder(){
  let o=readForm();
  if(!o.date||!o.customer||!o.app||!o.duration){toast('Isi tanggal, customer, aplikasi, dan durasi dulu ya ♡');return}
  let wasEdit=!!editId;
  if(editId){orders=orders.map(x=>x.id===editId?{...o,id:editId}:x);editId=null}else{o.id=uid();orders.push(o)}
  save();toast(wasEdit?'Perubahan tersimpan ✧':'Order tersimpan dengan manis ✿');
  wasEdit?go('rekapan'):render();
}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Belum ada data di sini ♡</td></tr>`}</tbody></table></div>`}

function filtered(){let q=filter.q.toLowerCase();return orders.filter(o=>(!filter.month||String(o.date).startsWith(filter.month))&&(!q||[o.customer,o.app,o.plan,o.user,o.fh,o.account].some(v=>String(v||'').toLowerCase().includes(q))))}
function rekapan(){
  let months=[...new Set(orders.map(o=>String(o.date).slice(0,7)).filter(Boolean))].sort().reverse();
  $('#content').innerHTML=`<div><div class="stats" id="rekapStats"></div>
  <div class="section-title"><h3>✿ Semua rekapan order</h3><div class="actions"><button class="softbtn" id="exportCsv">Export CSV</button><button class="softbtn" id="importCsv">Import CSV</button><input id="csvFile" type="file" accept=".csv" class="hidden"></div></div>
  <div class="toolbar"><input id="q" type="search" placeholder="Cari customer, aplikasi, plan, FH…" value="${esc(filter.q)}" aria-label="Cari order"><select id="month" aria-label="Filter bulan"><option value="">Semua bulan</option>${months.map(m=>`<option value="${m}" ${filter.month===m?'selected':''}>${new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('')}</select></div>
  <div id="rekapTable"></div><p class="small">Profit = pemasukan − pengeluaran. Pendapatan bersih = profit − diskon. Keduanya dihitung otomatis.</p></div>`;
  $('#q').oninput=e=>{filter.q=e.target.value;rekapBody()};$('#month').onchange=e=>{filter.month=e.target.value;rekapBody()};
  $('#exportCsv').onclick=exportCSV;$('#importCsv').onclick=()=>$('#csvFile').click();$('#csvFile').onchange=e=>importCSV(e.target.files[0]);
  rekapBody();
}
function rekapBody(){
  let list=filtered().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('#rekapStats').innerHTML=`${card('Total Pemasukan',money(sum(list,o=>Number(o.income)||0)),'↗',`${list.length} order`)}${card('Total Pengeluaran',money(sum(list,o=>Number(o.expense)||0)),'↘',`Diskon ${money(sum(list,o=>Number(o.discount)||0))}`)}${card('Total Bersih',money(sum(list,net)),'♡','Setelah pengeluaran & diskon')}`;
  let rows=list.map(o=>`<tr><td>${fmt(o.date)}</td><td>${esc(o.app)}</td><td>${esc(o.plan||'—')}</td><td>${esc(o.user||'—')}</td><td>${o.duration} hari</td><td>${esc(o.customer)}</td><td>${esc(o.fh||'—')}</td><td class="num">${money(o.income)}</td><td class="num">${money(o.expense)}</td><td class="num">${money(o.discount)}</td><td class="num">${money(profit(o))}</td><td class="num"><b>${money(net(o))}</b></td><td><button class="softbtn" onclick="editOrder('${esc(o.id)}')">Edit</button> <button class="softbtn danger" onclick="deleteOrder('${esc(o.id)}')">Hapus</button></td></tr>`).join('');
  $('#rekapTable').innerHTML=table(['Tanggal order','Aplikasi','Plan','User','Durasi','Nama customer','Nama FH','Pemasukan','Pengeluaran','Diskon','Profit','Pendapatan bersih','Aksi'],rows);
}
function editOrder(id){if(!orders.some(x=>x.id===id))return;editId=id;go('dashboard');$('#formPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function deleteOrder(id){let o=orders.find(x=>x.id===id);if(o&&confirm(`Hapus order ${o.customer} (${o.app})?`)){orders=orders.filter(x=>x.id!==id);save();render();toast('Order dihapus')}}

function reminder(){
  let rows=orders.slice().sort((a,b)=>{let o={due:0,soon:1,active:2,done:3};return o[state(a)]-o[state(b)]||remain(a)-remain(b)}).map(o=>{let r=remain(o),st=state(o),[label,cls]=STATE_LABEL[st];return `<tr><td>${esc(o.customer)}</td><td>${esc(o.app)}</td><td>${esc(o.account||o.user||'—')}</td><td>${fmt(o.date)}</td><td>${o.duration} hari</td><td><b>${st==='done'?0:r} hari</b></td><td>${esc(o.fh||'—')}</td><td>${fmt(endDate(o))}</td><td><span class="pill ${cls}">${label}</span></td><td>${st!=='done'?`<button class="softbtn" onclick="copyReminder('${esc(o.id)}')">Salin pesan</button>`:'—'}</td></tr>`}).join('');
  let need=orders.filter(o=>['due','soon'].includes(state(o))).length;
  $('#content').innerHTML=`<div><div class="notice">♡ Hitungan berdasarkan tanggal order + durasi (hari). Sisa durasi diperbarui otomatis setiap kali halaman dibuka. Renewal ditandai hari terakhir masa aktif; order yang lewat tanggal tersebut atau ditandai “selesai” berstatus selesai.</div><div class="section-title"><h3>ꕤ Jadwal renewal</h3><span class="pill">${need} perlu perhatian</span></div>${table(['Nama customer','Aplikasi','Akun','Tanggal order','Durasi','Durasi tersisa','Nama FH','Durasi habis','Status','Pesan'],rows)}</div>`;
}
async function copyReminder(id){let o=orders.find(x=>x.id===id);if(!o)return;let r=remain(o);let msg=`Halo ${o.customer} ♡\nMasa aktif ${o.app}${o.plan?' '+o.plan:''} kamu ${r===0?'berakhir hari ini':`akan berakhir ${r} hari lagi`} (${fmt(endDate(o))}).\nMau diperpanjang? ✿\n— Primpaii's Way`;try{await navigator.clipboard.writeText(msg);toast('Pesan reminder disalin ✿')}catch(e){prompt('Salin pesan ini:',msg)}}

function riwayat(){
  let counts={};orders.forEach(o=>{let k=o.app||'—';counts[k]=(counts[k]||0)+1});
  let popular=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let byCustomer={};orders.forEach(o=>{let k=o.customer.trim().toLowerCase();byCustomer[k]=byCustomer[k]||{name:o.customer,n:0,total:0};byCustomer[k].n++;byCustomer[k].total+=net(o)});
  let loyal=Object.values(byCustomer).sort((a,b)=>b.n-a.n||b.total-a.total).slice(0,5);
  let rows=orders.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(o=>`<tr><td>${esc(o.customer)}</td><td>${esc(o.app)}</td><td>${o.duration} hari</td><td>${esc(o.plan||'—')}</td><td>${esc(o.fh||'—')}</td><td>${fmt(o.date)}</td></tr>`).join('');
  $('#content').innerHTML=`<div><div class="two"><section class="panel"><div class="section-title"><h3>✧ Aplikasi paling sering diorder</h3></div>${popular.map(([n,c],i)=>`<div class="row" style="border:0;padding-bottom:0"><span>${i+1}. <b>${esc(n)}</b></span><b>${c} order</b></div><div class="bar"><span style="width:${100*c/(popular[0]?.[1]||1)}%"></span></div>`).join('')||'<div class="empty">Data aplikasi akan muncul setelah ada order ♡</div>'}</section>
  <section class="panel"><div class="section-title"><h3>♡ Total customer</h3></div><div class="bigvalue">${Object.keys(byCustomer).length}</div><p class="small">customer unik tercatat</p><div class="section-title"><h3>ꕤ Customer setia</h3></div>${loyal.map(c=>`<div class="row"><span><b>${esc(c.name)}</b><br><span class="small">${c.n} order</span></span><b>${money(c.total)}</b></div>`).join('')||'<div class="empty">Belum ada customer ♡</div>'}</section></div>
  <div class="section-title"><h3>ꕤ Riwayat order</h3></div>${table(['Nama customer','Aplikasi','Durasi','Plan','Nama FH','Tanggal order'],rows)}</div>`;
}

/* ---------- CSV, backup, sheets ---------- */
const KEYS=['date','app','plan','user','duration','customer','fh','income','expense','discount','account','status'];
function exportCSV(){let csv=[KEYS.join(','),...filtered().map(o=>KEYS.map(k=>`"${String(o[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n');download('﻿'+csv,`primpaiis-way-rekapan-${todayISO()}.csv`,'text/csv;charset=utf-8')}
function parseCSVLine(l){let a=[],s='',q=false;for(let i=0;i<l.length;i++){let c=l[i];if(c==='"'&&q&&l[i+1]==='"'){s+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(s);s=''}else s+=c}a.push(s);return a}
function importCSV(file){if(!file)return;let r=new FileReader();r.onload=()=>{let lines=String(r.result).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length){toast('File CSV kosong');return}let heads=parseCSVLine(lines.shift()).map(h=>h.trim());let incoming=lines.map(l=>{let a=parseCSVLine(l),o={};heads.forEach((h,i)=>o[h]=(a[i]??'').trim());o.id=uid();['duration','income','expense','discount'].forEach(k=>o[k]=Number(o[k])||0);o.status=o.status||'aktif';return o}).filter(o=>o.date&&o.customer);orders.push(...incoming);save();render();toast(`${incoming.length} order berhasil diimpor ✿`)};r.readAsText(file)}
function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){download(JSON.stringify({orders,settings:S},null,2),`primpaiis-way-backup-${todayISO()}.json`,'application/json')}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.orders))throw 0;if(!confirm(`Pulihkan ${d.orders.length} order? Data di browser ini akan diganti.`))return;orders=d.orders;Object.assign(S,d.settings||{});delete S.music;applyVolume();save();buildFloaters();render();toast('Backup berhasil dipulihkan ♡')}catch(e){toast('File backup tidak valid')}};r.readAsText(file)}
async function syncSheets(){if(!S.scriptUrl){toast('Isi URL Apps Script terlebih dahulu');return}if(!confirm(`Kirim ${orders.length} order ke Sheets? Isi tab Orders akan diganti.`))return;try{let r=await fetch(S.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'replace',orders})});let d=await r.json();toast(d.ok?`Berhasil sync ${d.count??orders.length} order ✿`:'Sync gagal')}catch(e){toast('Sync belum berhasil. Periksa URL dan deployment Apps Script.')}}
async function pullSheets(){if(!S.scriptUrl){toast('Isi URL Apps Script terlebih dahulu');return}try{let r=await fetch(S.scriptUrl);let d=await r.json();if(!d.ok)throw new Error('Sheet response');let incoming=(d.orders||[]).map(o=>({...o,id:o.id||uid(),date:String(o.date||'').slice(0,10),duration:Number(o.duration)||0,income:Number(o.income)||0,expense:Number(o.expense)||0,discount:Number(o.discount)||0,status:o.status||'aktif'}));if(!confirm(`Ambil ${incoming.length} baris dari Sheets dan mengganti data lokal di browser ini?`))return;orders=incoming;save();render();toast('Data dari Sheets berhasil dimuat ♡')}catch(e){toast('Gagal membaca Sheets. Periksa akses deployment Apps Script.')}}

/* ---------- ♫ My Little Playlist: Spotify Embed · YouTube IFrame API · HTML Audio ---------- */
const SRC={spotify:['Spotify','sp','●'],youtube:['YouTube','yt','▶'],url:['Custom URL','cu','♫']};
const SP_KIND={track:'lagu',album:'album',playlist:'playlist',episode:'podcast',show:'podcast',artist:'artis'};
const AUDIO_EXT={mp3:'audio/mpeg',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg; codecs=opus',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',weba:'audio/webm',webm:'audio/webm'};
const SP_HOST=/(^|\.)spotify\.(com|link)$|^spoti\.fi$/i,YT_HOST=/(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/i;
const PAGE_HOSTS=/(^|\.)(soundcloud\.com|music\.apple\.com|deezer\.com|tiktok\.com|instagram\.com|drive\.google\.com)$/i;
const YT_ERR={2:'Link YouTube tidak valid',5:'Video ini tidak bisa diputar di browser ini',100:'Video tidak tersedia, private, atau sudah dihapus',101:'Pemilik video tidak mengizinkan diputar di website lain · buka di YouTube ↗',150:'Pemilik video tidak mengizinkan diputar di website lain · buka di YouTube ↗'};
const HELP={
  spotify:['Link Spotify','https://open.spotify.com/track/...','Tempel link lagu, album, playlist, atau podcast Spotify (Bagikan → Salin link). Diputar lewat Spotify Embed resmi — website ini tidak pernah meminta password. Akun Spotify belum dihubungkan ke website ini: login di spotify.com pada browser ini agar lagu diputar penuh, tanpa login Spotify hanya memutar preview ±30 detik.','https://open.spotify.com','Buka Spotify ↗'],
  youtube:['Link YouTube','https://www.youtube.com/watch?v=...','Tempel link video, YouTube Music, atau playlist YouTube. Diputar lewat YouTube embed resmi di pemutar kecil (mode compact, tombol ⤢ untuk memperbesar). Beberapa video tidak mengizinkan diputar di website lain.','https://www.youtube.com','Buka YouTube ↗'],
  url:['URL file audio','https://.../lagu.mp3','Link file audio langsung yang bisa dibuka browser: MP3, OGG, atau WAV. Nuansa yang cocok: classical piano, romantic piano, soft instrumental, gentle piano melodies ♡','','']
};
const player=new Audio();player.preload='none';
const idx=id=>playlist.findIndex(t=>t.id===id);
const cur=()=>playlist[idx(curId)]||playlist[0]||null;
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

function parseLink(raw,tab){
  let sm=raw.match(/^spotify:(track|album|playlist|episode|show|artist):([A-Za-z0-9]{22})$/i);
  if(sm){if(tab!=='spotify')throw'Ini link Spotify · pilih tab Spotify ♡';let k=sm[1].toLowerCase();return{source:'spotify',kind:k,ref:sm[2],url:`https://open.spotify.com/${k}/${sm[2]}`}}
  let u;try{u=new URL(raw)}catch(e){throw'Link tidak valid. Salin link lengkap yang diawali https://'}
  if(!/^https?:$/.test(u.protocol))throw'Link harus diawali http:// atau https://';
  let isSp=SP_HOST.test(u.hostname),isYt=YT_HOST.test(u.hostname);
  if(tab==='spotify'){
    if(isYt)throw'Ini link YouTube · pilih tab YouTube ♡';
    if(!isSp)throw'Bukan link Spotify. Contoh: https://open.spotify.com/track/...';
    if(!/^(open|play)\.spotify\.com$/i.test(u.hostname))throw'Link pendek Spotify belum didukung · buka link-nya dulu lalu salin link open.spotify.com';
    let m=u.pathname.match(/^\/(?:intl-[a-z]{2}(?:-[a-z]{2})?\/)?(?:embed\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]{22})/i);
    if(!m)throw'Link Spotify tidak dikenali. Gunakan link lagu, album, playlist, atau podcast.';
    let k=m[1].toLowerCase();return{source:'spotify',kind:k,ref:m[2],url:`https://open.spotify.com/${k}/${m[2]}`};
  }
  if(tab==='youtube'){
    if(isSp)throw'Ini link Spotify · pilih tab Spotify ♡';
    if(!isYt)throw'Bukan link YouTube. Contoh: https://www.youtube.com/watch?v=...';
    let v=u.searchParams.get('v'),list=u.searchParams.get('list');
    if(/youtu\.be$/i.test(u.hostname))v=u.pathname.slice(1).split('/')[0];
    else{let m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);if(m)v=m[1]}
    if(v&&!/^[\w-]{11}$/.test(v))v=null;if(list&&!/^[\w-]{10,64}$/.test(list))list=null;
    if(!v&&!list)throw'Link YouTube tidak dikenali. Gunakan link video atau playlist.';
    return{source:'youtube',kind:v?'video':'playlist',ref:v||'',list:list||'',url:v?`https://www.youtube.com/watch?v=${v}${list?'&list='+list:''}`:`https://www.youtube.com/playlist?list=${list}`};
  }
  if(isSp||isYt)throw`Ini link ${isSp?'Spotify':'YouTube'} · pilih tab ${isSp?'Spotify':'YouTube'} agar bisa diputar ♡`;
  if(PAGE_HOSTS.test(u.hostname))throw'Link halaman musik bukan file audio langsung. Gunakan URL file MP3, OGG, atau WAV.';
  let ext=(u.pathname.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
  if(ext&&!AUDIO_EXT[ext])throw`Format .${ext} bukan file audio yang didukung. Gunakan MP3, OGG, atau WAV.`;
  if(ext&&!player.canPlayType(AUDIO_EXT[ext]))throw`Browser ini tidak mendukung format .${ext}. Coba MP3, OGG, atau WAV.`;
  return{source:'url',url:u.href};
}
function defaultName(t){
  if(t.source==='spotify')return`Spotify · ${SP_KIND[t.kind]}`;
  if(t.source==='youtube')return t.ref?'Video YouTube':'Playlist YouTube';
  let n='';try{n=decodeURIComponent(new URL(t.url).pathname.split('/').pop().replace(/\.[a-z0-9]+$/i,'')).replace(/[_-]+/g,' ').trim()}catch(e){}
  return n||`Lagu ${playlist.length+1}`;
}
function addMusic(){
  let raw=$('#mpLink').value.trim(),name=$('#mpName').value.trim(),artist=$('#mpArtistIn').value.trim();
  if(!raw){toast('Tempel link musik terlebih dahulu');return}
  let info;try{info=parseLink(raw,S.mpTab)}catch(err){toast(typeof err==='string'?err:'Link tidak valid');return}
  if(playlist.some(t=>t.url===info.url)){toast('Lagu ini sudah ada di playlist ♡');return}
  let t={id:uid(),kind:'',ref:'',list:'',fav:false,...info,name:(name||defaultName(info)).slice(0,80),artist:artist.slice(0,80)};
  playlist.push(t);save();['#mpLink','#mpName','#mpArtistIn'].forEach(k=>$(k).value='');drawMusic();toast(`♫ ${t.name} masuk playlist`);
}

/* loaders: official APIs are fetched only when a Spotify/YouTube song is first played */
let ytReady=null,spReady=null,spApiObj=null;
function addScript(src,rej){let el=document.createElement('script');el.src=src;el.async=true;el.onerror=rej;document.head.appendChild(el);setTimeout(rej,15000)}
function ytApi(){if(window.YT&&YT.Player)return Promise.resolve(YT);return ytReady||=new Promise((res,rej)=>{window.onYouTubeIframeAPIReady=()=>res(YT);addScript('https://www.youtube.com/iframe_api',rej)})}
function spApi(){if(spApiObj)return Promise.resolve(spApiObj);return spReady||=new Promise((res,rej)=>{window.onSpotifyIframeApiReady=api=>{spApiObj=api;res(api)};addScript('https://open.spotify.com/embed/iframe-api/v1',rej)})}

function stopAll(){
  gen++;isPlaying=false;
  player.pause();if(player.getAttribute('src')){player.removeAttribute('src');player.load()}
  try{yt&&yt.destroy()}catch(e){}yt=null;
  try{sp&&sp.destroy()}catch(e){}sp=null;
  $('#dkHost').innerHTML='';loadedId=null;spPos={pos:0,dur:0,at:0};
}
function showDock(t){
  let d=$('#mpDock');d.classList.remove('hidden');d.classList.toggle('compact',!!S.compact);document.body.classList.add('has-dock');
  $('#dkSrc').textContent=SRC[t.source][0];$('#dkSrc').className='src '+SRC[t.source][1];
  $('#dkTitle').textContent=t.name+(t.artist?' · '+t.artist:'');
  $('#dkOpen').href=t.url;$('#dkOpen').classList.toggle('hidden',t.source==='url');$('#dkSize').classList.toggle('hidden',t.source==='url');
  $('#dkHost').className=`dk-host ${t.source} k-${t.kind||'x'}`;
}
function closeDock(){stopAll();$('#mpDock').classList.add('hidden');document.body.classList.remove('has-dock');drawMusic()}
async function playAt(i){
  if(!playlist.length){toast('Playlist masih kosong · tambahkan musik dulu ♡');return}
  let t=playlist[(i+playlist.length)%playlist.length];
  stopAll();curId=loadedId=t.id;let g=gen;
  showDock(t);drawMusic();
  try{
    if(t.source==='url'){player.src=t.url;applyVolume();await player.play()}
    else if(t.source==='youtube'){
      let api=await ytApi();if(g!==gen)return;
      let el=document.createElement('div');$('#dkHost').appendChild(el);
      let pv={playsinline:1,rel:0};if(t.list){pv.list=t.list;if(!t.ref)pv.listType='playlist'}
      yt=new api.Player(el,{width:'100%',height:'100%',videoId:t.ref||undefined,playerVars:pv,events:{
        onReady:e=>{if(g!==gen)return;applyVolume();e.target.playVideo()},
        onStateChange:e=>{if(g!==gen)return;isPlaying=e.data===1||e.data===3;if(e.data===0){let pl=yt.getPlaylist&&yt.getPlaylist();if(pl&&pl.length&&yt.getPlaylistIndex()<pl.length-1)return;onEnded()}else drawMusic()},
        onError:e=>{if(g!==gen)return;isPlaying=false;toast(YT_ERR[e.data]||'Video YouTube tidak dapat diputar');drawMusic()}}});
    }else{
      let api=await spApi();if(g!==gen)return;
      let el=document.createElement('div');$('#dkHost').appendChild(el);
      api.createController(el,{uri:`spotify:${t.kind}:${t.ref}`,width:'100%',height:152},c=>{
        if(g!==gen){try{c.destroy()}catch(e){}return}
        sp=c;let was=false;
        c.addListener('ready',()=>{if(g===gen)c.play()});
        c.addListener('playback_update',e=>{
          if(g!==gen)return;let d=e.data||{},before=isPlaying;
          spPos={pos:(d.position||0)/1000,dur:(d.duration||0)/1000,at:performance.now()};
          let ended=was&&d.isPaused&&d.duration>0&&(d.position===0||d.position>=d.duration-1500);
          was=!d.isPaused;isPlaying=!d.isPaused;
          if(ended&&(t.kind==='track'||t.kind==='episode'))onEnded();else if(before!==isPlaying)drawMusic();
        });
      });
    }
  }catch(e){
    if(g!==gen||(e&&e.name==='AbortError'))return;
    isPlaying=false;
    if(t.source==='url')toast(e&&e.name==='NotAllowedError'?'Browser menahan pemutaran · tekan Play sekali lagi':'Lagu tidak bisa diputar. Pastikan URL mengarah langsung ke file audio.');
    else{toast(`${SRC[t.source][0]} tidak dapat dimuat. Periksa koneksi internet atau pemblokir iklan.`);if(t.source==='youtube')ytReady=null;else spReady=null}
    drawMusic();
  }
}
function togglePlay(){
  let t=cur();if(!t){toast('Playlist masih kosong · tambahkan musik dulu ♡');return}
  if(loadedId!==t.id)return playAt(idx(t.id));
  if(t.source==='url')player.paused?player.play().catch(()=>toast('Lagu tidak bisa diputar')):player.pause();
  else if(t.source==='youtube'){if(yt&&yt.getPlayerState)isPlaying?yt.pauseVideo():yt.playVideo()}
  else if(sp)sp.togglePlay();
}
function nextIndex(d,auto){
  let n=playlist.length,i=idx(curId);
  if(S.shuffle&&n>1&&d>0){let j;do j=Math.floor(Math.random()*n);while(j===i);return j}
  let j=i+d;if(j>=n)return auto&&S.repeat==='off'?-1:0;return j<0?n-1:j;
}
function step(d){if(playlist.length)playAt(nextIndex(d,false))}
function seekTo(sec){
  let t=cur();if(!t||loadedId!==t.id)return;
  try{if(t.source==='url')player.currentTime=sec;else if(t.source==='youtube')yt&&yt.seekTo(sec,true);else if(sp){sp.seek(sec);spPos={...spPos,pos:sec,at:performance.now()}}}catch(e){}
}
function onEnded(){
  let t=cur();if(!t)return;
  if(S.repeat==='one'){seekTo(0);if(t.source==='url')player.play().catch(()=>{});else if(t.source==='youtube')yt&&yt.playVideo();else sp&&sp.resume();return}
  let n=nextIndex(1,true);if(n<0){isPlaying=false;drawMusic();return}
  playAt(n);
}
function progress(){
  let t=cur();if(!t||loadedId!==t.id)return{pos:0,dur:0};
  if(t.source==='url')return{pos:player.currentTime||0,dur:isFinite(player.duration)?player.duration:0};
  if(t.source==='youtube')return yt&&yt.getDuration?{pos:yt.getCurrentTime()||0,dur:yt.getDuration()||0}:{pos:0,dur:0};
  return{pos:Math.min(spPos.dur,spPos.pos+(isPlaying?(performance.now()-spPos.at)/1000:0)),dur:spPos.dur};
}
function applyVolume(){
  let v=Math.min(1,Math.max(0,Number(S.volume)||0));player.volume=v;player.muted=!!S.muted;
  try{if(yt&&yt.setVolume){yt.setVolume(Math.round(v*100));S.muted?yt.mute():yt.unMute()}}catch(e){}
}
function moveTrack(id,d){let i=idx(id),j=i+d;if(i<0||j<0||j>=playlist.length)return;[playlist[i],playlist[j]]=[playlist[j],playlist[i]];save();drawMusic()}
function renameTrack(id){
  let t=playlist[idx(id)];if(!t)return;
  let name=prompt('Nama lagu',t.name);if(name===null)return;name=name.trim();
  if(!name){toast('Nama lagu tidak boleh kosong');return}
  let artist=prompt('Nama penyanyi / artis (boleh kosong)',t.artist);
  t.name=name.slice(0,80);if(artist!==null)t.artist=artist.trim().slice(0,80);
  save();drawMusic();if(loadedId===id)showDock(t);toast('Nama lagu diperbarui ✧');
}
function deleteTrack(id){
  let i=idx(id);if(i<0||!confirm(`Hapus “${playlist[i].name}” dari playlist?`))return;
  if(loadedId===id)closeDock();
  playlist.splice(i,1);if(curId===id)curId=(playlist[i]||playlist[0]||{}).id||null;
  save();drawMusic();toast('Lagu dihapus dari playlist');
}
function drawTab(){
  let [label,ph,help,link,linkName]=HELP[S.mpTab]||HELP.url;
  $$('.mp-tabs button').forEach(b=>{let on=b.dataset.tab===S.mpTab;b.classList.toggle('active',on);b.setAttribute('aria-selected',on)});
  $('#mpLinkLabel').innerHTML=`${label} <span class="req">*</span>`;$('#mpLink').placeholder=ph;$('#mpHelp').textContent=help;
  $('#mpOpenSrc').classList.toggle('hidden',!link);$('#mpOpenSrc').href=link||'#';$('#mpOpenSrc').textContent=linkName;
}
function drawProgress(){
  let r=$('#mpProg');if(!r||seeking)return;let {pos,dur}=progress();
  r.max=Math.floor(dur)||0;r.value=Math.floor(pos);r.disabled=!dur;$('#mpPos').textContent=mmss(pos);$('#mpDur').textContent=dur?mmss(dur):'--:--';
}
function drawMusic(){
  $('#dkPlay').textContent=isPlaying?'❚❚':'▶';
  if(isPlaying&&!tick)tick=setInterval(drawProgress,1000);else if(!isPlaying&&tick){clearInterval(tick);tick=null}
  if(!$('#mpList'))return;
  let t=cur(),n=playlist.length,i=playlist.indexOf(t),loaded=t&&loadedId===t.id,src=t&&t.source;
  $('#mpCount').textContent=`${n} lagu`;
  $('#mpTitle').textContent=t?t.name:'Belum ada lagu';
  $('#mpSub').innerHTML=t?`${t.artist?esc(t.artist)+' · ':''}<span class="src ${SRC[src][1]}">${SRC[src][0]}</span>`:'tambahkan musik di bawah ✧';
  $('#mpState').textContent=!t?'♡ ✧ ☁️':isPlaying?`♪ sedang diputar · ${i+1}/${n}`:`${loaded?'dijeda':'siap diputar'} · ${i+1}/${n}`;
  $('#mpPlay').textContent=isPlaying?'❚❚':'▶';$('#mpPlay').setAttribute('aria-label',isPlaying?'Pause':'Play');$('#mpPlay').classList.toggle('playing',isPlaying);
  ['#mpPlay','#mpPrev','#mpNext'].forEach(k=>$(k).disabled=!n);
  $('#mpShuf').classList.toggle('on',!!S.shuffle);$('#mpShuf').setAttribute('aria-pressed',!!S.shuffle);
  $('#mpRep').classList.toggle('on',S.repeat!=='off');$('#mpRep').textContent=S.repeat==='one'?'↻1':'↻';
  $('#mpRep').title=$('#mpRep').ariaLabel={off:'Repeat: mati',all:'Repeat: semua lagu',one:'Repeat: satu lagu'}[S.repeat];
  let noVol=src==='spotify';$('#mpVol').disabled=$('#mpMute').disabled=noVol;
  $('#mpMute').textContent=S.muted||!Number(S.volume)?'🔇':'🔊';$('#mpMute').setAttribute('aria-label',S.muted?'Unmute':'Mute');
  $('#mpNote').textContent=src==='spotify'?'Volume Spotify diatur dari pemutar Spotify di pojok bawah.':src==='youtube'?'Pemutar YouTube tampil kecil di pojok bawah · ⤢ untuk mengubah ukuran.':'';
  $('#mpFav').classList.toggle('primary',favOnly);$('#mpFav').classList.toggle('softbtn',!favOnly);$('#mpFav').setAttribute('aria-pressed',favOnly);
  $('#mpList').innerHTML=playlist.map((p,j)=>[p,j]).filter(([p])=>!favOnly||p.fav).map(([p,j])=>{let on=p.id===(t&&t.id),pl=on&&isPlaying;return`<div class="mp-row ${on?'on':''}" data-id="${esc(p.id)}"><button class="mp-ico" data-act="play" aria-label="${pl?'Pause':'Putar'} ${esc(p.name)}">${pl?'❚❚':'▶'}</button><div class="mp-info"><b>${pl?'♪ ':'✧ '}${esc(p.name)}</b><span class="small">${p.artist?esc(p.artist)+' · ':''}<span class="src ${SRC[p.source][1]}">${SRC[p.source][0]}</span></span></div><div class="mp-acts"><button data-act="fav" class="${p.fav?'faved':''}" aria-pressed="${p.fav}" aria-label="Favorit" title="Favorit">${p.fav?'♥':'♡'}</button><button data-act="up" ${j===0?'disabled':''} aria-label="Naikkan urutan" title="Naikkan">↑</button><button data-act="down" ${j===n-1?'disabled':''} aria-label="Turunkan urutan" title="Turunkan">↓</button><button data-act="edit" aria-label="Ganti nama" title="Ganti nama">✎</button><button data-act="del" aria-label="Hapus" title="Hapus">✕</button></div></div>`}).join('')||`<div class="empty">${favOnly?'Belum ada lagu favorit ♡':'☁️ Playlist masih kosong ♡<br><span class="small">tambahkan lagu pertama dari Spotify, YouTube, atau URL ✧</span>'}</div>`;
  drawProgress();
}
function bindMusic(){
  $$('.mp-tabs button').forEach(b=>b.onclick=()=>{S.mpTab=b.dataset.tab;save();drawTab()});
  $('#mpAdd').onclick=addMusic;$('#mpLink').onkeydown=e=>{if(e.key==='Enter')addMusic()};
  $('#mpPlay').onclick=togglePlay;$('#mpPrev').onclick=()=>step(-1);$('#mpNext').onclick=()=>step(1);
  $('#mpShuf').onclick=()=>{S.shuffle=!S.shuffle;save();drawMusic();toast(S.shuffle?'Shuffle aktif ⤮':'Shuffle mati')};
  $('#mpRep').onclick=()=>{S.repeat={off:'all',all:'one',one:'off'}[S.repeat]||'all';save();drawMusic();toast($('#mpRep').title)};
  $('#mpMute').onclick=()=>{S.muted=!S.muted;applyVolume();save();drawMusic()};
  $('#mpVol').oninput=e=>{S.volume=Number(e.target.value);if(S.volume>0)S.muted=false;applyVolume();drawMusic()};$('#mpVol').onchange=save;
  $('#mpProg').oninput=e=>{seeking=true;$('#mpPos').textContent=mmss(e.target.value)};
  $('#mpProg').onchange=e=>{seeking=false;seekTo(Number(e.target.value));drawProgress()};
  $('#mpFav').onclick=()=>{favOnly=!favOnly;drawMusic()};
  $('#mpList').onclick=e=>{
    let b=e.target.closest('button[data-act]');if(!b)return;let id=b.closest('.mp-row').dataset.id,a=b.dataset.act;
    if(a==='play')id===loadedId?togglePlay():playAt(idx(id));
    else if(a==='fav'){let t=playlist[idx(id)];t.fav=!t.fav;save();drawMusic()}
    else if(a==='up'||a==='down')moveTrack(id,a==='up'?-1:1);
    else if(a==='edit')renameTrack(id);else if(a==='del')deleteTrack(id);
  };
  drawTab();drawMusic();
}
const urlActive=()=>loadedId&&cur()&&cur().source==='url'&&loadedId===cur().id;
player.addEventListener('play',()=>{if(urlActive()){isPlaying=true;drawMusic()}});
player.addEventListener('pause',()=>{if(urlActive()){isPlaying=false;drawMusic()}});
player.addEventListener('loadedmetadata',drawProgress);
player.addEventListener('ended',()=>{if(urlActive())onEnded()});
player.addEventListener('error',()=>{if(player.getAttribute('src')&&urlActive()){isPlaying=false;toast('Lagu tidak bisa dimuat · URL tidak valid, tidak tersedia, atau format tidak didukung');drawMusic()}});
$('#dkPlay').onclick=togglePlay;$('#dkNext').onclick=()=>step(1);$('#dkClose').onclick=closeDock;
$('#dkSize').onclick=()=>{S.compact=!S.compact;save();$('#mpDock').classList.toggle('compact',S.compact)};
applyVolume();

/* ---------- ꕤ floating background ---------- */
function buildFloaters(){
  let box=$('#floaters');box.innerHTML='';
  if(S.floaty==='off')return;
  let w=window.innerWidth,count=Math.round(Math.min(S.floaty==='more'?30:20,Math.max(8,w/(S.floaty==='more'?50:90))));
  let rand=(a,b)=>a+Math.random()*(b-a),frag=document.createDocumentFragment(),SYM=['ꕤ','☁️','✧','♡','⋆'];
  let rows=[...Array(count).keys()].sort(()=>Math.random()-.5); // spread evenly over both axes
  for(let i=0;i<count;i++){
    let sym=SYM[i%SYM.length],cloud=sym==='☁️',size=cloud?rand(16,26):rand(11,24),el=document.createElement('div');
    el.className='floater'+(cloud?' emoji':'');
    el.style.cssText=`--x:${((i+rand(.15,.85))/count*96).toFixed(2)}%;--y:${((rows[i]+rand(.15,.85))/count*94).toFixed(2)}%;--size:${size.toFixed(1)}px;--bob:${rand(5,9).toFixed(1)}s;--drift-t:${rand(14,24).toFixed(1)}s;--delay:${-rand(0,20).toFixed(1)}s;--in:${rand(0,2.5).toFixed(1)}s;--amp:${rand(6,14).toFixed(0)}px;--dx:${rand(6,16).toFixed(0)}px;--rot:${rand(4,10).toFixed(0)}deg;--o:${(cloud?rand(.16,.26):rand(.14,.3)).toFixed(2)};--blur:${size>22?.4:0}px`;
    el.innerHTML=`<span>${sym}</span>`;frag.appendChild(el);
  }
  box.appendChild(frag);
}
let resizeTimer,lastW=window.innerWidth;window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lastW)<80)return;lastW=window.innerWidth;clearTimeout(resizeTimer);resizeTimer=setTimeout(buildFloaters,400)});

$$('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
buildFloaters();
render();
</script>
